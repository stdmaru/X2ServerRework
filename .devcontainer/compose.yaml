services:
  dev:
    build:
      context: ..
      dockerfile: docker/build/Dockerfile
      args:
        DEV_USER: vscode
        DEV_UID: 1000
        DEV_GID: 1000
    env_file:
      - path: ../docker/.env
        required: false
    network_mode: host
    user: vscode
    volumes:
      - ${HOME}/.cache/x2-build:/home/vscode/.cache/x2-build
    command: sleep infinity
