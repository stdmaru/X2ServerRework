# Local services for development (docs/tools/development-database.md).
#   docker compose -f docker/docker-compose.yml up -d     start (data stays in the x2-mssql-data volume)
#   docker/mssql/restore.sh                               restore _database/*.bak
# SQL binds only to 127.0.0.1; published server ports bind all host interfaces (see docs/running.md#network-ports).
# Development only. The sa password is local; set X2_DB_PASSWORD before first start to change it.
name: x2

# Core runtime template
x-server-template: &server-template
  image: x2-server:local
  environment:
    XDG_RUNTIME_DIR: /run
  depends_on:
    mssql:
      condition: service_healthy
  restart: unless-stopped

# Shared volumes
x-volume-time: &volume-time
  /etc/localtime:/etc/localtime:ro
x-volume-sockets: &volume-sockets
  "./control:/run"
x-volume-resources: &volume-resources
  ./ServerResource:/opt/x2/ServerResource:ro
x-volume-clientscripts: &volume-clientscripts
  ./ClientScript:/opt/x2/ClientScript:ro

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: x2-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${X2_DB_PASSWORD:-X2dev!Passw0rd}
    networks:
      x2-net:
        ipv4_address: 172.30.10.10
    ports:
      - "127.0.0.1:${X2_DB_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  epublisher:
    <<: *server-template
    volumes:
      - *volume-time
      - *volume-sockets
      - "./EPublisherServer/log:/opt/x2/EPublisherServer/log"
    networks:
      x2-net:
        ipv4_address: 172.30.10.30
    working_dir: /opt/x2/EPublisherServer
    command: ["./EPublisherServer", "DEV", "--no-stdin"]

  channel:
    <<: *server-template
    volumes:
      - *volume-time
      - *volume-sockets
      - *volume-resources
      - *volume-clientscripts
      - "./ChannelServer/log:/opt/x2/ChannelServer/log"
    networks:
      x2-net:
        ipv4_address: 172.30.10.31
    ports:
      - 9400:9400/tcp
    working_dir: /opt/x2/ChannelServer
    command: ["./ChannelServer", "DEV", "0", "--no-stdin"]

  login:
    <<: *server-template
    volumes:
      - *volume-time
      - *volume-sockets
      - *volume-resources
      - *volume-clientscripts
      - "./LoginServer/log:/opt/x2/LoginServer/log"
    networks:
      x2-net:
        ipv4_address: 172.30.10.32
    working_dir: /opt/x2/LoginServer
    command: ["./LoginServer", "DEV", "0", "--no-stdin"]

  center:
    <<: *server-template
    volumes:
      - *volume-time
      - *volume-sockets
      - *volume-resources
      - *volume-clientscripts
      - "./CenterServer/log:/opt/x2/CenterServer/log"
    networks:
      x2-net:
        ipv4_address: 172.30.10.33
    ports:
      - "9101:9101/udp"
    working_dir: /opt/x2/CenterServer
    command: ["./CenterServer", "DEV", "0", "--no-stdin"]

  global:
    <<: *server-template
    volumes:
      - *volume-time
      - *volume-sockets
      - *volume-resources
      - *volume-clientscripts
      - "./GlobalServer/log:/opt/x2/GlobalServer/log"
    networks:
      x2-net:
        ipv4_address: 172.30.10.34
    working_dir: /opt/x2/GlobalServer
    command: ["./GlobalServer", "DEV", "0", "--no-stdin"]

  game_01:
    <<: *server-template
    volumes:
      - *volume-time
      - *volume-sockets
      - *volume-resources
      - *volume-clientscripts
      - "./GameServer/log:/opt/x2/GameServer/log"
    networks:
      x2-net:
        ipv4_address: 172.30.10.35
    ports:
      - 9300:9300/tcp
      - 9301:9301/tcp
      - 9301:9301/udp
    working_dir: /opt/x2/GameServer
    command: ["./GameServer", "DEV", "0", "--no-stdin"]

volumes:
  mssql-data:
    name: x2-mssql-data

networks:
  x2-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.1
