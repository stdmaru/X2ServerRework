
# Build and tests (docs/tools/ci.md).
# Linux jobs build the project's Ubuntu 26.04 build image locally (docker/build/Dockerfile),
# the same one used by docker/build.sh for local builds.
# The image is never published: it exists only on the runner.
# Each architecture/compiler combination runs as an independent job.
# Windows is built with clang-cl on a Windows runner (T26).
# The build must have no warnings (AGENTS.md): any warning in the log fails the job.
name: CI

# Minutes are limited (private repository, 2000/month; Windows counts 2x): automatic only on main, after an
# integration. Work branches are checked locally (docker/build.sh) and dispatched by hand when needed:
#   gh workflow run ci.yml --ref <branch> [-f jobs=windows|linux|all]   (default: windows, the part not checkable locally)
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", ".claude/**"]
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs to run"
        type: choice
        options: [windows, linux, all]
        default: windows

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: ${{ matrix.name }}
    if: github.event_name == 'push' || inputs.jobs != 'windows'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-26.04
            preset: linux-debug

          - name: linux-x86_64-gcc
            runner: ubuntu-26.04
            preset: linux-gcc

          - name: linux-arm64
            runner: ubuntu-26.04-arm
            preset: linux-debug


    env:
      BUILD_IMAGE: x2-build:ci
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - uses: actions/checkout@v4

      - name: ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.name }}-

      - name: Prepare build environment
        run: |
          mkdir -p "$CCACHE_DIR"
          docker build -t "$BUILD_IMAGE" docker/build

      - name: Configure
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CCACHE_DIR=/workspace/.ccache \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$BUILD_IMAGE" \
            cmake --preset "${{ matrix.preset }}" -DX2_RUN_FOLDERS=OFF

      - name: Build
        run: |
          set -o pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CCACHE_DIR=/workspace/.ccache \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$BUILD_IMAGE" \
            bash -c "
              set -o pipefail
              cmake --build build/${{ matrix.preset }} 2>&1 | tee build.log
              ! grep -n 'warning:' build.log
            "

      - name: Test
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CCACHE_DIR=/workspace/.ccache \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$BUILD_IMAGE" \
            ctest --test-dir "build/${{ matrix.preset }}" --output-on-failure

  windows:
    name: ${{ matrix.name }}
    if: github.event_name == 'push' || inputs.jobs != 'linux'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-latest
            preset: windows-debug
            architecture: x64

          # Enable when Windows ARM64 builds are ready:
          # - name: windows-arm64
          #   runner: windows-11-arm
          #   preset: windows-arm64-debug
          #   architecture: arm64

    defaults:
      run:
        # not Git Bash: its /usr/bin/link would shadow the Visual Studio linker that msvcbuild.bat calls
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.architecture }}

      - name: Versions
        run: |
          clang-cl --version
          cmake --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DX2_RUN_FOLDERS=OFF

      - name: Build
        run: |
          cmake --build build/${{ matrix.preset }} -- -k 0 2>&1 | Tee-Object -FilePath build.log
          $status = $LASTEXITCODE

          # clang-cl, and cl/link (LuaJIT, linker)
          $warnings = Select-String -Path build.log -Pattern 'warning( [A-Z]+[0-9]+)?:'
          if ($warnings) { $warnings; exit 1 }

          exit $status

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

  checks:
    name: Importer and wiki
    if: github.event_name == 'push' || inputs.jobs != 'windows'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Importer tests
        run: |
          python3 tools/import/tests/test_condres.py
          python3 tools/import/tests/test_flagsim.py

      - name: Wiki links
        run: python3 tools/docs/check_links.py
