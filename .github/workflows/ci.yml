# Build and tests on every push and pull request (docs/ferramentas/ci.md).
# Every job runs in the project's Ubuntu build image (docker/build/Dockerfile, decision T24), the same one used by
# docker/build.sh for local builds. The image is published to GHCR, tagged by the Dockerfile's hash, and only
# rebuilt when the Dockerfile changes.
# The build must have no warnings (AGENTS.md): any "warning:" in the log fails the job.
name: CI

# Minutes are limited (private repository, 2000/month; Windows counts 2x): automatic only on main, after an
# integration. Work branches are checked locally (docker/build.sh) and dispatched by hand when needed:
#   gh workflow run ci.yml --ref <branch>
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", ".claude/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag
        id: tag
        run: |
          tag=$(sha256sum docker/build/Dockerfile | cut -c1-16)
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/x2-build:$tag" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push (if new)
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE already published"
          else
            docker build -t "$IMAGE" docker/build
            docker push "$IMAGE"
          fi

  linux:
    name: ${{ matrix.name }}
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            preset: linux-debug
          - name: GCC Release
            preset: linux-release
          - name: Clang Release
            preset: clang
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
      - name: ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ubuntu-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-ubuntu-${{ matrix.preset }}-
      - name: Configure
        run: |
          if [ "${{ matrix.preset }}" = clang ]; then
            cmake -S . -B build/clang -G Ninja -DCMAKE_BUILD_TYPE=Release -DX2_DEV_TOOLS=OFF \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          else
            cmake --preset ${{ matrix.preset }}
          fi
      - name: Build
        run: |
          set -o pipefail
          cmake --build build/${{ matrix.preset }} 2>&1 | tee build.log
          ! grep -n "warning:" build.log
      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

  mingw:
    name: MinGW Debug + Wine
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
      - name: ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ubuntu-mingw-debug-${{ github.sha }}
          restore-keys: ccache-ubuntu-mingw-debug-
      - name: Configure
        run: cmake --preset mingw-debug
      - name: Build
        run: |
          set -o pipefail
          cmake --build build/mingw-debug 2>&1 | tee build.log
          ! grep -n "warning:" build.log
      - name: Test (Wine)
        env:
          WINEPREFIX: /root/.wine   # the container runs as root; the workspace and $HOME are not owned by it
        run: |
          wineboot --init
          ctest --test-dir build/mingw-debug --output-on-failure

  msvc:
    name: MSVC Debug
    # The Windows build that ships (T18); not in the Ubuntu image. Windows minutes cost 2x on private repositories.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Visual Studio environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset windows-debug
      - name: Build
        run: |
          set -o pipefail
          cmake --build build/windows-debug 2>&1 | tee build.log
          ! grep -nE "warning( [A-Z]+[0-9]+)?:" build.log
      - name: Test
        run: ctest --test-dir build/windows-debug --output-on-failure

  checks:
    name: Importer and wiki
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Importer tests
        run: |
          python3 tools/import/tests/test_condres.py
          python3 tools/import/tests/test_flagsim.py
      - name: Wiki links
        run: python3 tools/docs/check_links.py
